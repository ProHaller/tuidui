[package]
name = "tuidui"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1.0.89"
async-openai = "0.24.1"
chrono = "0.4.38"
clap = "4.5.19"
colored = "2.1.0"
crossterm = "0.28.1"
dotenv = "0.15.0"
include_dir = "0.7.4"
ratatui = "0.28.1"
serde = { version = "1.0.210", features = ["derive"] }
serde_json = "1.0.128"
sqlx = { version = "0.8.2", features = [
  "runtime-tokio-native-tls",
  "postgres",
  "uuid",
  "chrono",
  "json",
  "time",
] }
thiserror = "1.0.64"
tokio = { version = "1.40.0", features = ["full"] }
uuid = { version = "1.10.0", features = ["v4"] }
